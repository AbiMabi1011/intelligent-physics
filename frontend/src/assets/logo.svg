<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <path id="curveTop" d="M 100,250 A 150,150 0 0,1 400,250" />
    <path id="curveBottom" d="M 130,250 A 120,120 0 0,0 370,250" />
  </defs>
  
  <!-- White Background Circle -->
  <circle cx="250" cy="250" r="240" fill="white" />
  
  <!-- Brain Outline (Simplified) -->
  <path d="M 180,180 Q 150,150 180,120 Q 210,90 250,120 Q 290,90 320,120 Q 350,150 320,180" fill="none" stroke="#8B2e2e" stroke-width="8" stroke-linecap="round" />
  <path d="M 180,180 Q 140,220 160,280" fill="none" stroke="#8B2e2e" stroke-width="8" stroke-linecap="round" />
  <path d="M 320,180 Q 360,220 340,280" fill="none" stroke="#8B2e2e" stroke-width="8" stroke-linecap="round" />
  <path d="M 245,120 L 245,280" fill="none" stroke="#8B2e2e" stroke-width="8" stroke-linecap="round" />
  
  <!-- Lightbulb -->
  <g transform="translate(220, 160) scale(0.6)">
    <path d="M 50,0 A 50,50 0 0,1 50,100 L 50,130 L 50,130" fill="white" stroke="#8B2e2e" stroke-width="8" />
    <path d="M 35,100 L 35,130 Q 50,140 65,130 L 65,100" fill="none" stroke="#8B2e2e" stroke-width="6" />
    <path d="M 40,40 Q 60,20 60,60" fill="none" stroke="#8B2e2e" stroke-width="6" />
  </g>

  <!-- Rectangular Box for Name -->
  <rect x="110" y="260" width="280" height="60" fill="white" stroke="#8B2e2e" stroke-width="5" />
  
  <!-- Text: R. RAAKULAN -->
  <text x="250" y="305" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#8B2e2e" text-anchor="middle" letter-spacing="2">R. RAAKULAN</text>

  <!-- Text: INTELLIGENT PHYSICS -->
  <text width="500">
    <textPath href="#curveTop" startOffset="50%" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#8B2e2e" letter-spacing="4">
      INTELLIGENT PHYSICS
    </textPath>
  </text>
  
  <!-- Text: THINK POSITIVE -->
   <text x="250" y="400" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#8B2e2e" text-anchor="middle" letter-spacing="4" transform="rotate(0, 250, 250)">
    THINK POSITIVE
  </text>
  <path d="M 180,350 Q 250,420 320,350" fill="none" stroke="#8B2e2e" stroke-width="0" /> 
  <!-- Adjusted curved text for Think Positive -->
   <text width="500">
    <textPath href="#curveBottom" startOffset="50%" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#8B2e2e" letter-spacing="4" side="left">
      <!-- Approximating curve by manual placement or flipping path -->
    </textPath>
  </text>
</svg>
